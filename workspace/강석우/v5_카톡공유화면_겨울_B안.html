   글자 크기·줄바꿈은 Pretendard가 불러와진 상태를 기준으로 맞췄습니다.
   서체가 안 불러와지면(시스템 서체로 대체) 글자 폭이 달라져 줄바꿈 위치가 바뀔 수 있습니다. */
:root{
  --t1:#0B0D0F; --t3:#727780;
  --blue:#0068FF; --direct:#0685CD;
  --surface:#FFFFFF;
  --r-btn:16px; --r-panel:28px; --r-pill:60px; --r-sm:8px;
  /* 겨울 남색 (랜딩 결과 문구 색 #1E2A4A·#3B4766, L249-250) */
  --ink:#1E2A4A; --ink-2:#3B4766; --snowbg:#F7FAFE;
  /* 카카오 계열 (색만 사용, 로고 파일 없음) */
  --kakao:#FEE500; --kakao-ink:#191919; --chat-bg:#B2C7D9;
  --ease-soft:cubic-bezier(.22,.61,.36,1);
  --sb-h:32px; --nb-h:48px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;background:#E9EEF5}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:24px;color:var(--t1);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg{display:block}

.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--snowbg);display:flex;flex-direction:column}
.no-chrome{--sb-h:0px;--nb-h:0px}
.no-chrome .sbar,.no-chrome .nbar{display:none}

/* 가짜 안드로이드 상태 표시줄 · 하단 3버튼 바 (장표용) */
.sbar{flex:none;height:var(--sb-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;font-size:14px;font-weight:600;letter-spacing:.01em;color:#1A1C1F;position:relative;z-index:5;transition:background .5s}
.sbar .ics{display:flex;align-items:center;gap:5px}
.sbar svg{height:14px;width:auto}
.nbar{flex:none;height:var(--nb-h);display:flex;align-items:center;justify-content:space-around;padding:0 44px;background:#fff;color:#55595F;position:relative;z-index:5}
.nbar svg{width:22px;height:22px}
.app[data-view="share"] .sbar{background:#fff}
.app[data-view="chat"] .sbar{background:var(--chat-bg)}

.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden;opacity:0;transition:opacity .5s var(--ease-soft),transform .6s var(--ease-soft),visibility 0s .6s}
.view.on{visibility:visible;opacity:1;transform:none;transition:opacity .55s var(--ease-soft) .08s,transform .7s var(--ease-soft) .08s,visibility 0s}
#v-share:not(.on){transform:scale(.985)}
#v-chat:not(.on){transform:translateX(28px)}

/* ================= 1. 공유 화면 (랜딩 안) ================= */
#v-share{background:linear-gradient(180deg,#fff 0,var(--snowbg) 40%,#EAF0F8 100%)}
.bar{flex:none;height:52px;display:flex;align-items:center;gap:4px;padding:0 20px 0 8px}
.bar .bk{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--t1)}
.bar .bk svg{width:22px;height:22px}
.bar .brand{font-size:17px;font-weight:700;color:var(--direct)}
.bar .meta{margin-left:auto;font-size:14px;color:var(--t3)}

.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:0 0 calc(var(--sheet-h) + 14px);container-type:size}
:root{--sheet-h:236px}
.card{position:relative;width:min(calc(100vw - 56px),260px);width:min(100cqw - 56px,(100cqh - 4px) * .5496,320px);min-width:min(190px,100cqw - 40px);aspect-ratio:var(--art-ratio);border-radius:22px;box-shadow:0 26px 48px -22px rgba(14,30,70,.55),0 1px 3px rgba(14,30,70,.14)}
/* 결과 카드(공유 카드·카톡 카드 공통): 위에서 아래로 "어머니와 / 16번 / 우리가 함께할 겨울(로고)" 한 문장 */
.rc{container-type:inline-size;position:relative;overflow:hidden;isolation:isolate;background:#1C2C4E var(--art-card) center top/100% auto no-repeat;color:var(--cream)}
:root{--cream:#FFF6DC;--glow:rgba(255,196,110,.55)}
.rc::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(10,20,46,.38) 0,rgba(10,20,46,.18) 22%,rgba(10,20,46,0) 32%)}
.rc canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.res{position:absolute;left:0;right:0;top:6cqw;z-index:2;padding:0 7.5cqw}
.rc-who{font-size:7cqw;line-height:1.3;font-weight:700;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 8px rgba(6,14,34,.6)}
.num{display:flex;align-items:baseline;gap:.8cqw;line-height:.95;margin-top:.5cqw}
.num b{font-size:26cqw;font-weight:900;letter-spacing:-.05em;font-variant-numeric:tabular-nums;text-shadow:0 0 22px var(--glow),0 2px 10px rgba(6,14,34,.45)}
.pf .num b{margin-left:var(--num-optical)}
:root{--num-optical:-.30em} /* Pretendard가 불러와졌을 때만 적용(html.pf). "1"의 세로획을 위아래 글줄 왼쪽 끝에 맞추는 값 (4배율에서 픽셀로 잼) */
.num span{font-size:8.5cqw;font-weight:800;text-shadow:0 2px 10px rgba(6,14,34,.45)}
.logo-row{width:66cqw;aspect-ratio:4199/778;margin-top:3.2cqw;background:var(--art-logo) left center/contain no-repeat;filter:drop-shadow(0 1px 4px rgba(6,14,34,.5))}
/* 보조 정보(작게): 함께 먹을 밥 96번 / 이 숫자는 늘릴 수 있어요 / 1년 6번 뵙는 기준 */
.meal{position:absolute;left:7.5cqw;width:52%;bottom:5.5cqw;z-index:2;color:var(--cream);text-shadow:0 1px 6px rgba(6,14,34,.7)}
.meal p{font-size:5cqw;line-height:1.35;font-weight:700;letter-spacing:-.01em}
.meal .hope{font-size:4.6cqw;font-weight:600;opacity:.95}
.meal .basis{font-size:3.9cqw;line-height:1.3;font-weight:500;opacity:.7;margin-top:.8cqw}
.rc.has-meal::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;z-index:1;background:linear-gradient(0deg,rgba(10,20,46,.62) 0,rgba(10,20,46,.3) 45%,rgba(10,20,46,0) 100%)}
.no-meal .meal{display:none}
.no-meal .rc.has-meal::after{display:none}

/* 공유 시트 (밝은 화면 위, 어둡게 덮지 않음) */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--surface);color:var(--t1);border-radius:var(--r-panel) var(--r-panel) 0 0;padding:10px 20px 18px;box-shadow:0 -10px 30px -14px rgba(11,40,100,.28);transition:transform .6s var(--ease-soft)}
.sheet.down{transform:translateY(calc(100% + 8px))}
.grab{width:36px;height:4px;border-radius:2px;background:#D5D8DD;margin:0 auto 12px}
.sh-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh-hd h2{font-size:20px;line-height:28px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.sh-x{width:36px;height:36px;margin-right:-8px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--t3)}
.sh-x svg{width:22px;height:22px}
.kakao{width:100%;height:62px;border-radius:var(--r-btn);background:var(--kakao);color:var(--kakao-ink);font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s,filter .2s}
.kakao svg{width:26px;height:26px}
.kakao:active{transform:scale(.98);filter:brightness(.97)}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.alts button{height:52px;border-radius:var(--r-btn);background:#F2F4F7;font-size:16px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.alts button:active{background:#E6E9EE}
.alts svg{width:20px;height:20px;color:var(--t3)}
.reopen{position:absolute;left:20px;right:20px;bottom:18px;z-index:3;height:58px;border-radius:var(--r-btn);background:var(--blue);color:#fff;font-size:18px;font-weight:700;box-shadow:0 10px 24px -8px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .4s,transform .4s var(--ease-soft)}
.sheet.down ~ .reopen{opacity:1;transform:none;pointer-events:auto;transition-delay:.3s}

/* 들어오는 움직임 (부드럽게) */
#v-share.on .card{animation:cardIn 1.2s var(--ease-soft) .1s both}
#v-share.on .res > *,#v-share.on .meal{animation:rise .9s var(--ease-soft) both}
#v-share.on .rc-who{animation-delay:.5s}
#v-share.on .num{animation-delay:.65s}
#v-share.on .logo-row{animation-delay:.85s}
#v-share.on .meal{animation-delay:1.1s}
#v-share.on .sheet:not(.down){animation:sheetIn .8s var(--ease-soft) .5s both}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}

/* ================= 2. 카카오톡 채팅방 (예시) ================= */
#v-chat{background:var(--chat-bg);color:var(--kakao-ink)}
.k-hd{height:52px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px 0 6px}
.k-hd button{width:40px;height:40px;display:grid;place-items:center;color:#2B2F33}
.k-hd svg{width:23px;height:23px}
.k-hd .who{font-size:19px;font-weight:700;margin-right:auto;margin-left:2px}
.k-body{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 18px;display:flex;flex-direction:column;gap:6px}
.k-date{align-self:center;margin:2px 0 14px;padding:5px 14px;border-radius:var(--r-pill);background:rgba(40,60,80,.18);color:#fff;font-size:13px;line-height:18px;font-weight:500}
.msg{display:grid;grid-template-columns:42px 1fr;column-gap:8px;align-items:start}
.ava{width:42px;height:42px;border-radius:16px;background:#9FB4C7;display:grid;place-items:end center;overflow:hidden;grid-row:span 3}
.ava svg{width:32px;height:32px;color:#E9F0F6}
.k-name{font-size:13px;line-height:16px;color:#3E4A55;margin:1px 0 5px}
.k-row{display:flex;align-items:flex-end;gap:5px}
.k-row + .k-row{margin-top:6px}
.k-time{flex:none;font-size:11px;line-height:13px;color:#4F5D6A;padding-bottom:1px}
.bub{position:relative;max-width:calc(100% - 50px);background:#fff;border-radius:4px 16px 16px 16px;padding:11px 14px;font-size:19.5px;line-height:27px;font-weight:500;letter-spacing:-.01em}
.bub::before{content:"";position:absolute;left:-5px;top:0;width:10px;height:10px;background:#fff;clip-path:polygon(0 0,100% 0,100% 100%)}
.feed{width:calc(100% - 50px);max-width:280px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.f-img{aspect-ratio:1/1} /* 결과 카드를 정사각형으로 잘라 씀: 글자와 불빛 나무가 보이고, 아래쪽(엄마·딸, 밥 줄)은 잘림 */
.f-img .meal{display:none}
.f-txt{padding:13px 16px 2px}
.f-txt h3{font-size:23px;line-height:30px;font-weight:800;letter-spacing:-.025em}
.f-txt p{margin-top:4px;font-size:14px;line-height:19px;color:#8A8F95}
.f-btn{display:block;margin:12px 12px 12px;width:calc(100% - 24px);height:46px;border-radius:8px;background:#F1F2F4;font-size:17px;font-weight:700;color:var(--kakao-ink)}
.k-in{flex:none;display:flex;align-items:center;gap:8px;background:#fff;padding:8px 10px}
.k-in .plus{width:32px;height:32px;display:grid;place-items:center;color:#8A8F95}
.k-in .plus svg{width:22px;height:22px}
.k-in .field{flex:1;height:36px;border-radius:18px;background:#F4F5F7}
.k-in .ic{width:30px;height:30px;display:grid;place-items:center;color:#8A8F95}
.k-in .ic svg{width:22px;height:22px}
#v-chat.on .msg-1{animation:rise .6s var(--ease-soft) .45s both}
#v-chat.on .msg-2{animation:rise .7s var(--ease-soft) .95s both}

/* 토스트 */
.toast{position:absolute;left:50%;top:60px;z-index:9;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:rgba(25,31,40,.92);color:#fff;font-size:15px;line-height:20px;font-weight:600;padding:11px 18px;border-radius:var(--r-pill);white-space:nowrap;transition:opacity .3s,transform .3s var(--ease-soft)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-height:740px){:root{--sheet-h:222px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

  <symbol id="i-talk" viewBox="0 0 24 24"><path d="M12 4.2c-5 0-9 3.1-9 7 0 2.5 1.6 4.6 4.1 5.9-.2.9-.7 2.3-1.5 3.3 1.8-.2 3.6-1.2 4.6-2 .6.1 1.2.1 1.8.1 5 0 9-3.1 9-7s-4-7.3-9-7.3z" fill="currentColor" stroke="currentColor" stroke-width=".6" stroke-linejoin="round"/></symbol>

  <!-- 안드로이드 바 아이콘 (단순 도형) -->
  <symbol id="s-sig" viewBox="0 0 18 14"><g fill="currentColor"><rect x="0" y="10" width="3" height="4" rx=".8"/><rect x="5" y="7" width="3" height="7" rx=".8"/><rect x="10" y="4" width="3" height="10" rx=".8"/><rect x="15" y="0" width="3" height="14" rx=".8"/></g></symbol>

</svg>

<main class="app" id="app" data-view="share">
  <div class="sbar" aria-hidden="true"><span data-t="clock"></span><span class="ics"><svg viewBox="0 0 18 14" style="width:17px"><use href="#s-wifi"/></svg><svg viewBox="0 0 18 14" style="width:17px"><use href="#s-sig"/></svg><svg viewBox="0 0 26 14" style="width:25px"><use href="#s-bat"/></svg></span></div>

  <div class="views">
  <!-- 1. 공유 화면: 랜딩 결과에서 "공유하기"를 누른 직후 -->
  <section class="view on" id="v-share" aria-label="공유하기">
    <header class="bar">
      <button class="bk" id="backResult" aria-label="결과로 돌아가기"><svg><use href="#i-bk"/></svg></button>
      <span class="brand" data-t="brand"></span><span class="meta" data-t="tool"></span>
    </header>

    <div class="stage">
      <article class="card rc has-meal" id="shareCard" aria-label="공유할 결과 카드">
        <canvas class="snow" aria-hidden="true"></canvas>
        <div class="res">
          <p class="rc-who" data-t="who"></p>
          <p class="num"><b data-v="winters"></b><span data-t="unit"></span></p>
          <div class="logo-row" role="img" data-aria-t="eventName"></div>
        </div>
        <div class="meal">
          <p data-t="mealLine"></p>
          <p class="hope" data-t="hope"></p>
          <p class="basis" data-t="mealBasis"></p>
        </div>
      </article>
    </div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle">
      <div class="grab" aria-hidden="true"></div>
      <div class="sh-hd">
        <h2 id="sheetTitle" data-t="sheetTitle"></h2>
        <button class="sh-x" id="sheetClose" aria-label="닫기"><svg><use href="#i-x"/></svg></button>
      </div>
      <button class="kakao" id="toKakao"><svg aria-hidden="true"><use href="#i-talk"/></svg><span data-t="kakaoBtn"></span></button>
      <div class="alts">
        <button id="copyLink"><svg aria-hidden="true"><use href="#i-link"/></svg><span data-t="copyBtn"></span></button>
        <button id="saveImg"><svg aria-hidden="true"><use href="#i-save"/></svg><span data-t="saveBtn"></span></button>
      </div>
    </div>
    <button class="reopen" id="sheetOpen" data-t="reopenBtn"></button>
  </section>

  <!-- 2. 받는 사람의 카카오톡 채팅방 (예시 화면, 실제 카카오톡 아님) -->
  <section class="view" id="v-chat" aria-label="카카오톡으로 받은 메시지 예시" aria-hidden="true">
    <header class="k-hd">
      <button id="backShare" aria-label="공유 화면으로 돌아가기"><svg><use href="#i-bk"/></svg></button>
      <span class="who" data-t="sender"></span>
      <button aria-label="검색" tabindex="-1"><svg><use href="#i-search"/></svg></button>
      <button aria-label="메뉴" tabindex="-1"><svg><use href="#i-menu"/></svg></button>
    </header>
    <div class="k-body">
      <p class="k-date" data-t="date"></p>
      <div class="msg">
        <div class="ava" aria-hidden="true"><svg><use href="#i-person"/></svg></div>
        <p class="k-name" data-t="sender"></p>
        <div class="k-row msg-1"><p class="bub" data-t="chatText"></p></div>
        <div class="k-row msg-2">
          <article class="feed" aria-label="공유된 링크 카드">
            <div class="f-img rc" role="img" data-aria="card">
              <canvas class="snow" aria-hidden="true"></canvas>
              <div class="res">
                <p class="rc-who" data-t="who"></p>
                <p class="num"><b data-v="winters"></b><span data-t="unit"></span></p>
                <div class="logo-row"></div>
              </div>
            </div>
            <div class="f-txt">
              <h3 data-t="feedTitle"></h3>
              <p data-t="service"></p>
            </div>
            <button class="f-btn" id="feedBtn" data-t="feedBtn"></button>
          </article>
          <span class="k-time" data-t="time"></span>
        </div>
      </div>
    </div>
    <div class="k-in" aria-hidden="true">
      <span class="plus"><svg><use href="#i-plus"/></svg></span>
      <span class="field"></span>
      <span class="ic"><svg><use href="#i-smile"/></svg></span>
      <span class="ic"><svg><use href="#i-hash"/></svg></span>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="nbar" aria-hidden="true"><svg><use href="#n-rec"/></svg><svg><use href="#n-home"/></svg><svg><use href="#n-back"/></svg></div>
</main>

<script>
/* =====================================================================
   목업 안내: 카카오 SDK·서버 호출 없음. 모든 동작은 이 페이지 안에서만 일어납니다.
   ===================================================================== */

/* ---- 숫자 (랜딩 v8 예시값: 어머니 74세 → 16번. 원본 L286 value="74", L315 data-n="16") ---- */
const WHO = '어머니';      // 랜딩 L520
const WINTERS = 16;        // 랜딩 L315 (랜딩 예시값: 어머니 74세일 때. 74는 화면에 안 나와서 변수로 두지 않음)
const FREQ = 6;            // 랜딩 L422 S.freq (1년에 뵙는 횟수)
const MEALS = WINTERS * FREQ; // 랜딩 L525 meet = main.w * S.freq → 16 × 6 = 96
const SHOW_MEAL = true;    // 보조 한 줄(밥 96번) 보이기. 주소 끝 ?meal=0 이면 숨김(비교용)
const JOSA = {'어머니':'와', '아버지':'와', '부모님':'과'}[WHO];  // 어머니와 / 아버지와 / 부모님과
const CALL = {'어머니':'엄마', '아버지':'아빠'}[WHO];  // NEW: 가족끼리 부르는 말 (말풍선용)

/* ---- 새로 쓴 문구 (NEW, 랜딩에 없는 문장) — 바꾸려면 여기만 고치면 됩니다 ---- */
const NEW_COPY = {
  sheetTitle: '소중한 사람에게 전해 보세요',                    // NEW: 공유 시트 제목 (B안, 가족으로 한정하지 않음)
  kakaoBtn:   '카카오톡으로 공유하기',                          // NEW (작업 지시서 문구)
  copyBtn:    '링크 복사',                                      // NEW (작업 지시서 문구)
  saveBtn:    '이미지 저장',                                    // NEW (작업 지시서 문구)
  reopenBtn:  '공유하기',                                       // NEW (작업 지시서 문구, 시트를 닫았을 때 다시 여는 버튼)
  toastCopy:  '링크를 복사했어요',                              // NEW: 링크 복사 토스트
  toastSave:  '이미지를 저장했어요',                            // NEW: 이미지 저장 토스트 (목업)
  toastBack:  '결과 화면으로 돌아가요',                         // NEW: 뒤로 가기 안내 (목업)
  sender:     '동생',                                           // NEW: 보낸 사람 이름 (예시, "언니"에게 보내는 동생)
  chatText:   `언니, 이거 해봤어? ${CALL}랑 같이 보낼 겨울이 ${WINTERS}번이래. 우리 올겨울엔 뭐 할까?`, // NEW: 보낸 사람 한마디 (팀장 수정안)
  feedBtn:    '나도 세어 보기',                                 // NEW: 카톡 카드 버튼 (작업 지시서 문구)
  who:        `${WHO}${JOSA}`,                                  // NEW(재구성): 카드 첫 줄 "어머니와" — 다음 줄 16번, 로고로 이어지는 한 문장
  feedTitle:  '나의 겨울은 몇 번 남았을까요?',                   // NEW: 카톡 카드 제목 (받는 사람에게 건네는 질문)
  mealLine:   `함께 먹을 밥 ${MEALS}번`,                         // NEW(줄임): 랜딩 L559 '부모님과 함께 먹을 밥'에서 '부모님과'를 뺌 (첫 줄 어머니와와 겹침 방지)
  time:       '오후 10:27',                                     // NEW: 채팅 시간 (상태 표시줄 22:27과 맞춘 화면 예시값)
  date:       '2026년 11월 13일 금요일',                        // NEW: 채팅방 날짜 칩 (화면 예시값 = 작업일)
  clock:      '22:27'                                           // NEW: 상태 표시줄 시각 (장표 속 첫 번째 폰과 맞춤)
};

/* ---- 랜딩에서 그대로 가져온 문구 (SRC, 괄호 안은 원본 줄 번호) ---- */
const SRC_COPY = {
  brand:     '삼성화재 다이렉트',                               // L265
  tool:      '남은 겨울 계산기',                                // L265
  eventName: '우리가 함께할 겨울',                              // L207 인트로 키비주얼 그림 속 제목. 화면에는 로고 그림으로만 나오고, 이 글자는 화면 읽기용
  unit:      '번',                                              // L315
  mealBasis: `1년 ${FREQ}번 뵙는 기준`,                         // L559 '1년 6번 뵙는 기준' (숫자만 FREQ 변수)
  hope:      '이 숫자는 늘릴 수 있어요',                        // L560 — 랜딩에서는 세 번째 숫자(한 달에 한 번 뵈면 192번)에 붙은 말. 밥 96번에 붙인 것은 이번 변형(승인 필요)
  service:   '삼성화재 다이렉트'                                // L265 (카톡 카드 서비스 이름 줄. '남은 겨울 계산기'는 제목 '나의 겨울은 몇 번 남았을까요?'와 뜻이 겹쳐 뺌)
};

const COPY = {...SRC_COPY, ...NEW_COPY};
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
if (Q.get('chrome') === '0') $('app').classList.add('no-chrome');
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = COPY[el.dataset.t]; });
document.querySelectorAll('[data-v="winters"]').forEach(el => { el.textContent = WINTERS; });
document.querySelectorAll('[data-aria]').forEach(el => el.setAttribute('aria-label', `${COPY.who} ${WINTERS}${COPY.unit}, ${COPY.eventName}`));
if (!SHOW_MEAL || Q.get('meal') === '0') $('app').classList.add('no-meal');
document.querySelectorAll('[data-aria-t]').forEach(el => el.setAttribute('aria-label', COPY[el.dataset.ariaT]));

/* ---- 토스트 ---- */
let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---- 화면 전환 ---- */
const views = {share:$('v-share'), chat:$('v-chat')};
let current = 'share';
function go(name, quiet){
  current = name; $('app').dataset.view = name;
  Object.entries(views).forEach(([k, v]) => { v.classList.toggle('on', k === name); v.setAttribute('aria-hidden', k !== name); });
  if (name === 'share') $('sheet').classList.remove('down');
  startSnow();
  if (!quiet) (name === 'chat' ? $('backShare') : $('toKakao')).focus({preventScroll:true});
}
$('toKakao').onclick = () => go('chat');            // 목업: 실제 공유 대신 받는 쪽 화면으로 이동
$('backShare').onclick = () => go('share');
$('feedBtn').onclick = () => go('share');           // 목업: 랜딩 첫 화면 대신 공유 화면으로 복귀
$('backResult').onclick = () => toast(COPY.toastBack);
$('sheetClose').onclick = () => $('sheet').classList.add('down');
$('sheetOpen').onclick = () => $('sheet').classList.remove('down');
$('copyLink').onclick = () => {
  try { navigator.clipboard && navigator.clipboard.writeText(location.href).catch(() => {}); } catch (e) {}
  toast(COPY.toastCopy);
};
$('saveImg').onclick = () => toast(COPY.toastSave);  // 목업: 실제 파일 저장 없음
document.addEventListener('keydown', e => { if (e.key === 'Escape') current === 'chat' ? go('share') : $('sheet').classList.add('down'); });

/* ---- 눈 (랜딩 v8 startSnow, L597-618 구조 그대로. 그림 영역 안에서만 내림) ---- */
let snowRAF;
function startSnow(){
  const cv = document.querySelector(current === 'share' ? '.card .snow' : '.f-img .snow');
  const ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  const o = {n: Math.round(W * H / 3600), size:1.5, wind:.3, gust:.45, fall:.5, wobble:.25}; // 그림에 눈이 이미 그려져 있어 가볍게
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const flakes = Array.from({length: still ? Math.round(o.n * .4) : o.n}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*o.size+.6, s:Math.random()*1.2+.6, o:Math.random()*.5+.3, ph:Math.random()*6.28}));
  const t0 = performance.now(), mine = current;
  cancelAnimationFrame(snowRAF);
  const draw = now => {
    const t = (now - t0) / 1000, gust = o.wind + Math.sin(t * 1.3) * o.gust + Math.sin(t * 3.1) * o.gust * .35;
    ctx.clearRect(0,0,W,H);
    for (const f of flakes){
      if (!still){ f.x += gust * f.s + Math.sin(t * 1.6 + f.ph) * o.wobble; f.y += f.s * o.fall; }
      if (f.x > W + 6) f.x = -6; if (f.x < -6) f.x = W + 6;
      if (f.y > H + 6){ f.y = -6; f.x = Math.random() * W; }
      ctx.globalAlpha = f.o * .7; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fillStyle = '#fff'; ctx.fill();
    }
    if (!still && current === mine) snowRAF = requestAnimationFrame(draw);
  };
  snowRAF = requestAnimationFrame(draw);
}
window.addEventListener('resize', startSnow);
if (Q.get('state') === 'chat') go('chat', true); else startSnow();
/* 큰 숫자 광학 정렬은 Pretendard 글자 모양 기준이라, 서체가 불러와졌을 때만 켭니다 */
if (document.fonts) document.fonts.ready.then(() => {
  const ok = [...document.fonts].some(f => f.family.replace(/["']/g, '') === 'Pretendard' && String(f.weight) === '900' && f.status === 'loaded');
  if (ok) document.documentElement.classList.add('pf');
});
</script>
</body>
</html>
